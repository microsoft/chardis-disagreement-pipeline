disagreement_explainer:
  data_path:
    description: Original experiment dataset is not included in this package.
    value: ''
  data_filename:
    description: CSV filename inside data_path. Ignored if data_path already points
      at a file.
    value: annotated_data.csv
  guidelines_path:
    description: Directory (or full path) of the annotation guidelines markdown.
    value: ../replication_prompts/ghc-syn/
  guidelines_filename:
    description: Markdown filename inside guidelines_path. Ignored if guidelines_path
      already points at a file.
    value: prompt.md
  examples_path:
    description: The path to in-context examples.
    value: ''
  output_path:
    description: Directory where preprocessing artifacts, raw outputs, metadata.json,
      and final disagreement_explanations.json are written. Created if missing.
    value: ../pipeline_run_outputs/ghc-syn/legacy/ghc-syn_v14/
  example_size:
    description: The number of in-context examples to provide.
    value: 8
  train_on_test:
    description: Whether to train on test data.
    value: false
  more_than_2:
    description: Whether there are more than 2 annotators.
    value: false
  num_annotations:
    description: The number of annotations to process from the input data. Use -1
      to process all data (default = -1).
    value: -1
  random_state:
    description: Random seed for sampling.
    value: 42
  num_threads:
    description: The number of threads to use for parallel processing (default = 10).
    value: 10
  project_name:
    description: Project name (set by run_disagreement CLI).
    value: ghc-syn
  version:
    description: Version label (set by run_disagreement CLI).
    value: v14
  version_note:
    description: Free-text note describing this saved version.
    value: 'Cloned from v5: ghc-syn DeepSeek-R1 analysis (1 iter, [deployment removed]
      evaluator). Held-out: cap to top 9 by F1-rank; logits sweep over k in {3, 6,
      9} (capped by available significant count). Validation cloned wholesale (skip-guarded
      for ghc-syn; yelp re-runs validation).'
evaluation:
  model:
    description: ''
    value: ''
  num_iterations:
    description: ''
    value: 1
  api_version:
    description: Legacy compatibility field. Not sent by current adapters.
    value: 2025-04-01-preview
  num_threads:
    description: ''
    value: 10
  concepts_per_batch:
    description: ''
    value: 10
  top_hypotheses:
    description: 'Held-out only: cap the number of significant validation hypotheses
      annotated on the held-out set to the top-N by F1-rank. Validation eval is unaffected.'
    value: 9
  top_ks:
    description: 'Held-out logits sweep: list of k values for top-k feature subsets
      (in addition to all_significant and all_significant_corrected). Effective k
      caps at the count of significant validation hypotheses.'
    value:
    - 3
    - 6
    - 9
  api_key_env:
    value: MODEL_API_KEY
  auth_mode:
    value: api-key
  credential_endpoint:
    value: ''
  credential_provider:
    value: compatible
  endpoint:
    description: ''
    value: ''
  message_role:
    value: developer
  provider:
    value: compatible
  request_timeout:
    value: 120.0
  scope:
    description: Legacy compatibility field. Current adapters do not acquire OAuth
      tokens.
    value: ''
