rationales:
  model:
    description: The model identifier to use.
    value: ''
  endpoint:
    description: The API endpoint to use.
    value: ''
  api_version:
    description: Legacy compatibility field. Not sent by current adapters.
    value: ''
  temperature:
    description: Controls randomness. Lowering the temperature means that the model
      will produce more repetitive and deterministic responses (default = 1.0).
    value: 1.0
  max_tokens:
    description: Set a limit on the number of tokens per model response. Any non-positive
      value will not be passed to the API (default = -1).
    value: -1
  max_completion_tokens:
    description: Set a limit on the number of tokens per model response. Any non-positive
      value will not be passed to the API (default = -1).
    value: -1
  top_p:
    description: Similar to temperature, this controls randomness but uses a different
      method (default = 1.0).
    value: 1.0
  frequency_penalty:
    description: Reduce the chance of repeating a token proportionally based on how
      often it has appeared in the text so far (default = 0.0).
    value: 0.0
  presence_penalty:
    description: Reduce the chance of repeating any token that has appeared in the
      text at all so far (default = 0.0).
    value: 0.0
  key:
    description: The API key to use when making model API calls.
    value: ''
  logprobs:
    description: Whether to return logprobs for the generated tokens (default = False).
    value: false
  top_logprobs:
    description: The number of top logprobs to return if logprobs is enabled (default
      = 1).
    value: 1
  scope:
    description: Legacy compatibility field. Current adapters do not acquire OAuth tokens.
    value: ''
  min_retry_delay:
    description: The minimum delay between retries in seconds (default = 1.0).
    value: 1.0
  max_retry_delay:
    description: The maximum delay between retries in seconds (default = 30.0).
    value: 30.0
  max_retries:
    description: The maximum number of retries for transient errors. Any non-positive
      value means no retries (default = 5).
    value: 5
  stream:
    description: Whether to use streaming responses from the API (default = False).
    value: false
  with_raw_response:
    description: Whether to return the raw response from the API (default = False).
    value: false
  provider:
    description: Provider adapter for a compatible hosted service.
    value: compatible
  auth_mode:
    value: api-key
  api_key_env:
    value: MODEL_API_KEY
  credential_endpoint:
    value: ''
  credential_provider:
    value: compatible
  message_role:
    value: developer
  request_timeout:
    value: 120.0
